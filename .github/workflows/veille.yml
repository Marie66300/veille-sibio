name: Automation Veille Marches SI BIO

on:
  schedule:
    # Déclenchement automatique les lundis et jeudis à 07:00 UTC
    - cron: '0 7 * * 1,4'
  workflow_dispatch: # Permet de lancer la veille manuellement à tout moment

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Exécuter le script de veille marchés
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python veille_marches_sibio.py
